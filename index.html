<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
          table, th, td {
            border: 1px solid;
          }
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu!!!</h1>
      
          <img src="plate_blue.jpg" width="50">
          <img src="plate_yellow.jpg" width="50">
      
        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Spaghetti</td>
                    <td>Pasta, tomato sauce, parmesan</td>
                    <td>$12</td>
                </tr>
                 <tr>
                    <td>Steak</td>
                    <td>16 oz ribeye, asparagus, mashed potatoes</td>
                    <td>$25</td>
                    
                </tr>
                 </tr>
                 <tr>
                    <td>Salad</td>
                    <td>Mixed greens, cherry tomatoes, cucumber</td>
                    <td>$10</td>
                    
                </tr>
            </tbody>
        </table>


    </body>
</html>
